# Codemagic CI/CD — Match Word (Flutter in `app/`)
#
# Secrets are never committed. Load them in the Codemagic UI under
# Environment variables (see docs/Codemagic Setup.md).
#
# Group `appstore_credentials` (all Secret):
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY   ← contents of AuthKey_….p8
#   CERTIFICATE_PRIVATE_KEY         ← REQUIRED (RSA PEM for Distribution cert)
#
# Group `matchword_app_secrets` (Secret) so CI can write app/.env:
#   SUPABASE_URL, SUPABASE_ANON_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials
        - matchword_app_secrets
      vars:
        # Hardcoded so another app’s BUNDLE_ID secret cannot override Match Word.
        BUNDLE_ID: "com.matchword.matchWord"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Ensure Flutter app/.env for bundled assets
        script: |
          set -euo pipefail
          ENV_FILE="$CM_BUILD_DIR/app/.env"
          if [ -n "${SUPABASE_URL:-}" ]; then
            printf '%s\n' \
              "SUPABASE_URL=${SUPABASE_URL}" \
              "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
              "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}" \
              "ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-DHeX7CCuOXUPRpnb0AdT}" \
              > "$ENV_FILE"
            echo "Wrote $ENV_FILE from Codemagic secrets."
          elif [ -f "$ENV_FILE" ]; then
            echo "Using existing $ENV_FILE"
          else
            echo "ERROR: add group matchword_app_secrets (SUPABASE_URL, SUPABASE_ANON_KEY, …)"
            exit 1
          fi

      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter precache --ios
          if [ ! -f ios/Podfile ]; then
            flutter build ios --config-only --no-codesign || true
          fi
          find ios -name "Podfile" -execdir pod install \;

      - name: Set up keychain
        script: keychain initialize

      - name: Check App Store signing secrets
        script: |
          set -euo pipefail
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: missing secret $v in Codemagic group appstore_credentials"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See docs/Codemagic Setup.md — Codemagic needs CERTIFICATE_PRIVATE_KEY"
            echo "to create/save the Apple Distribution certificate."
            exit 1
          fi
          echo "Signing secrets present. Bundle ID will be: com.matchword.matchWord"

      - name: Fetch / create App Store signing files
        script: |
          set -euo pipefail
          # Explicit Match Word bundle — do not use a mutable env override here.
          app-store-connect fetch-signing-files "com.matchword.matchWord" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles

      - name: Resolve TestFlight build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"

          # pubspec is the source of truth for what testers are told to install.
          # PROJECT_BUILD_NUMBER (Codemagic's own counter) must never be used:
          # it restarts low and made TestFlight show "Build 6" for build 84.
          PUBSPEC_BUILD="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/.*+//' | tr -d '[:space:]')"
          case "$PUBSPEC_BUILD" in
            ''|*[!0-9]*)
              echo "ERROR: could not read build number from pubspec.yaml version:"
              exit 1
              ;;
          esac
          BUILD_NUMBER="$PUBSPEC_BUILD"

          # Apple rejects a build number that is not higher than the last
          # upload, so raise (never lower) to stay above TestFlight.
          APP_ID="${APP_STORE_APPLE_ID:-}"
          if [ -z "$APP_ID" ]; then
            APP_ID="$(app-store-connect apps list \
              --bundle-id-identifier "com.matchword.matchWord" \
              --json 2>/dev/null \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["id"] if d else "")' 2>/dev/null || true)"
          fi

          LATEST=""
          if [ -n "$APP_ID" ]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || true)"
          fi
          case "${LATEST:-}" in
            ''|*[!0-9]*) LATEST="" ;;
          esac

          if [ -n "$LATEST" ] && [ "$LATEST" -ge "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((LATEST + 1))
          fi

          echo "$BUILD_NUMBER" > "$CM_BUILD_DIR/build_number.txt"
          echo "=================================================="
          echo " pubspec build      : $PUBSPEC_BUILD"
          echo " latest on TestFlight: ${LATEST:-unknown}"
          echo " UPLOADING AS BUILD : $BUILD_NUMBER"
          echo "=================================================="

      - name: Flutter build IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          BUILD_NUMBER="$(cat "$CM_BUILD_DIR/build_number.txt")"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=MW_BUILD="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          echo "Built Match Word 1.0.0 ($BUILD_NUMBER) — testers must see this number."

    artifacts:
      - app/build/ios/ipa/*.ipa
      - build_number.txt
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - rljjmckenzie@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
        # Hand each build straight to the tester group. Without this, an
        # external group has to be added by hand in App Store Connect and
        # testers keep whatever build they already had.
        #
        # Uncomment and set the EXACT group name from App Store Connect →
        # TestFlight → Testers and Groups (a wrong name fails this step):
        # beta_groups:
        #   - Match Word Testers

  android-apk:
    name: Android APK (CI)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - matchword_app_secrets
      flutter: stable
    scripts:
      - name: Ensure Flutter app/.env
        script: |
          set -euo pipefail
          ENV_FILE="$CM_BUILD_DIR/app/.env"
          if [ -n "${SUPABASE_URL:-}" ]; then
            printf '%s\n' \
              "SUPABASE_URL=${SUPABASE_URL}" \
              "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
              "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}" \
              "ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-DHeX7CCuOXUPRpnb0AdT}" \
              > "$ENV_FILE"
          elif [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: add matchword_app_secrets"
            exit 1
          fi
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter pub get
      - name: Build universal release APK
        script: |
          # Fat APK (all ABIs). Do not add --target-platform or --split-per-abi.
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          BUILD_NUM="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/.*+//' | tr -d '[:space:]')"
          flutter build apk --release --dart-define=MW_BUILD="$BUILD_NUM"
          STAMP="$(date +%Y%m%d)"
          mkdir -p "$CM_BUILD_DIR/apks"
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            "$CM_BUILD_DIR/apks/MatchWord-v${BUILD_NUM}Universal-${STAMP}.apk"
          ls -lh "$CM_BUILD_DIR/apks"/MatchWord-v${BUILD_NUM}Universal-*.apk
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
      - apks/MatchWord-*Universal-*.apk
