name: match_word
description: Match Word — a real-time multiplayer word game for seniors (Grandma Mac).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / realtime / auth
  supabase_flutter: ^2.5.6

  # Local secure storage for session + device fingerprint
  flutter_secure_storage: ^9.2.2

  # Stable device fingerprint for trial-abuse prevention
  device_info_plus: ^10.1.0
  uuid: ^4.4.0

  # PIN hashing
  crypto: ^3.0.3

  # Lightweight state management
  provider: ^6.1.2

  # Native share sheet — share a game code outside the app (M4)
  share_plus: ^10.0.0

  # Host + audio system: theme music, SFX cues, host voice clips (M6)
  audioplayers: ^6.1.0

  # Lightweight persistence for sound settings (mute / volume) (M6)
  shared_preferences: ^2.3.2

  # Environment configuration
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icons (Android + web). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/matchword-app-icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#3B1A63"
  adaptive_icon_foreground: "assets/images/matchword-app-icon.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#3B1A63"
  web:
    generate: true
    image_path: "assets/images/matchword-app-icon.png"
    background_color: "#3B1A63"
    theme_color: "#5B2D8E"
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/host/
    - assets/audio/
    - assets/audio/voice/
    - assets/images/character/
    - assets/images/character/base/
    - assets/images/character/hair/
    - assets/images/character/outfit/
    - assets/images/character/glasses/
    - assets/images/character/hat/
    - assets/images/character/earrings/
    - assets/images/character/accessory/
