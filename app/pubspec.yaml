name: match_word
description: Match Word — a real-time multiplayer word game for seniors (Grandma Mac).
publish_to: "none"
version: 1.0.0+89

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.6
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  provider: ^6.1.2
  share_plus: ^10.0.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/images/matchword-app-icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#3B1A63"
  adaptive_icon_foreground: "assets/images/matchword-app-icon.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#3B1A63"
  web:
    generate: true
    image_path: "assets/images/matchword-app-icon.png"
    background_color: "#3B1A63"
    theme_color: "#5B2D8E"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/grandmac-logo.jpg
    - assets/images/host/host-avatar.png
    - assets/images/host/host-stage.png
    - assets/images/host/host-idle.png
    - assets/images/host/host-stage-plate.png
    - assets/images/host/talk/
    - assets/images/host/talk/welcome/
    - assets/images/Studio_background.png
    - assets/images/Seat_on.png
    - assets/images/Seat_off.png
    - assets/images/host/actions/
    - assets/images/host/actions/frames/listening/
    - assets/images/host/actions/frames/welcome-wave/
    - assets/images/host/actions/frames/green-flag-wave/
    - assets/images/host/actions/frames/red-flag-shake/
    - assets/images/host/actions/frames/golden-card-reveal/
    - assets/images/host/actions/frames/winner-announce/
    - assets/images/host/bust-female.png
    - assets/images/host/bust-male.png
    - assets/audio/
    - assets/audio/voice/
    - assets/audio/voice/envelopes/
    - assets/images/host/mouth/
    - assets/images/character/base/body-female.png
    - assets/images/character/base/body-male.png
    - assets/images/character/hair/
    - assets/images/character/outfit/
    - assets/images/character/glasses/
    - assets/images/character/hat/
    - assets/images/character/earrings/
    - assets/images/character/accessory/
    - assets/images/character/poses/female/
    - assets/images/character/poses/male/
    - assets/images/trophies/
    - assets/images/prizes/
