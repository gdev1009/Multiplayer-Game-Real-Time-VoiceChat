<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="match_word">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>match_word</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Hide Flutter web's native text-editing overlay (white pill). */
    input, textarea {
      background: transparent !important;
      background-color: transparent !important;
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      caret-color: #E8B84A !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      opacity: 0 !important;
    }
  </style>
  <script>
    // Flutter may host inputs inside shadow roots — page CSS won't reach them.
    (function () {
      function paintTransparent(root) {
        try {
          const style = document.createElement('style');
          style.setAttribute('data-mw-input-fix', '1');
          style.textContent =
            'input,textarea{background:transparent!important;background-color:transparent!important;color:transparent!important;-webkit-text-fill-color:transparent!important;caret-color:#E8B84A!important;border:0!important;outline:0!important;box-shadow:none!important;opacity:0!important;}';
          if (!root.querySelector('style[data-mw-input-fix]')) root.appendChild(style);
          root.querySelectorAll('input,textarea').forEach((el) => {
            el.style.setProperty('background', 'transparent', 'important');
            el.style.setProperty('background-color', 'transparent', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('color', 'transparent', 'important');
          });
          root.querySelectorAll('*').forEach((el) => {
            if (el.shadowRoot) paintTransparent(el.shadowRoot);
          });
        } catch (_) {}
      }
      const tick = () => paintTransparent(document);
      document.addEventListener('DOMContentLoaded', tick);
      setInterval(tick, 400);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
